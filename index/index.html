<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подарок для Марьям аппы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marck+Script&display=swap">
<style>
/* Одна сцена: бархатная коробка → комплименты прописью → открытка-медальон с лепестками */
:root{
  --bg:#1a0d17; --plum:#3b1730; --velvet:#7a1f45; --velvet2:#4a0f2a;
  --gold:#e8c27a; --gold2:#a87b35; --cream:#fbf1e4; --rose:#f2a7b8;
  --script:"Marck Script","Segoe Script",cursive;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--serif);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 45%,#4a1a3a 0%,transparent 70%),radial-gradient(60% 40% at 50% 105%,#5a2a1a 0%,transparent 70%),var(--bg)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.glowFloor{position:absolute;left:50%;top:62%;width:min(80vw,420px);height:90px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(232,194,122,.35),transparent);filter:blur(10px)}

/* ---------- КОРОБКА ---------- */
#giftWrap{display:flex;flex-direction:column;align-items:center;gap:34px;cursor:pointer;outline:none;position:relative}
.toptext{font-family:var(--script);font-size:clamp(26px,7vw,40px);color:var(--gold);text-align:center;
  text-shadow:0 0 18px rgba(232,194,122,.45)}
.gift{position:relative;width:min(58vw,240px);aspect-ratio:1/1;max-width:100%;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.box{position:absolute;left:4%;right:4%;bottom:0;height:68%;border-radius:6px;
  background:linear-gradient(135deg,var(--velvet) 0%,var(--velvet2) 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 30px 50px rgba(0,0,0,.5)}
.box::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 3px,transparent 3px 8px)}
.lid{position:absolute;left:0;right:0;top:20%;height:20%;border-radius:6px;z-index:2;
  background:linear-gradient(135deg,#8f2752 0%,#5a1333 100%);box-shadow:0 8px 16px rgba(0,0,0,.4)}
.rib-v{position:absolute;top:0;bottom:0;left:50%;width:14%;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold2),#f7e1ae,var(--gold2))}
.box .rib-h{position:absolute;left:0;right:0;top:40%;height:14%;background:linear-gradient(180deg,var(--gold2),#f7e1ae,var(--gold2))}
.bow{position:absolute;left:50%;top:6%;width:58%;height:22%;transform:translateX(-50%);z-index:3}
.bow i{position:absolute;bottom:0;width:48%;height:100%;border:7px solid var(--gold);border-radius:60% 60% 30% 30%;
  box-shadow:0 0 14px rgba(232,194,122,.6),inset 0 0 8px rgba(168,123,53,.6)}
.bow i:nth-child(1){left:0;transform:rotate(-22deg);transform-origin:right bottom}
.bow i:nth-child(2){right:0;transform:rotate(22deg);transform-origin:left bottom}
.bow b{position:absolute;left:50%;bottom:-6px;width:20%;height:44%;transform:translateX(-50%);border-radius:40%;
  background:radial-gradient(circle at 40% 35%,#fff3cf,var(--gold) 50%,var(--gold2))}
.tag{position:absolute;right:-6%;top:44%;z-index:4;transform:rotate(12deg);transform-origin:top left;
  background:var(--cream);color:var(--velvet2);font-family:var(--script);font-size:clamp(15px,4vw,19px);
  padding:6px 12px 6px 18px;border-radius:4px 10px 10px 4px;box-shadow:0 6px 14px rgba(0,0,0,.4);white-space:nowrap}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--gold2)}
.hint{font:italic 500 clamp(16px,4.2vw,20px) var(--serif);letter-spacing:.12em;color:var(--rose);animation:soft 2.6s ease-in-out infinite}
@keyframes soft{50%{opacity:.4}}
#giftWrap:focus-visible .gift{outline:2px solid var(--gold);outline-offset:10px;border-radius:8px}

.gift.wiggle{animation:wiggle 1.1s ease-in-out 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-5deg)}30%{transform:rotate(5deg)}45%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}75%{transform:rotate(-1deg)}}
.gift.open .bow{animation:bowOff 1.4s ease-in forwards}
@keyframes bowOff{to{transform:translate(-50%,-160%) scale(.4) rotate(40deg);opacity:0}}
.gift.open .lid{animation:lidOff 1.8s cubic-bezier(.5,0,.7,1) .5s forwards}
@keyframes lidOff{to{transform:translate(70%,-260%) rotate(38deg);opacity:0}}
.gift.open .tag{animation:fadeAway 1s ease forwards}
@keyframes fadeAway{to{opacity:0;transform:rotate(30deg) translateY(30px)}}
.beam{position:absolute;left:50%;bottom:62%;width:70%;height:0;transform:translateX(-50%);z-index:1;
  background:linear-gradient(0deg,rgba(255,232,180,.95),rgba(255,232,180,0));filter:blur(6px);border-radius:50% 50% 0 0}
.gift.open .beam{animation:beam 2.2s ease-out 1s forwards}
@keyframes beam{0%{height:0;opacity:0}40%{opacity:1}100%{height:220%;opacity:.9}}

#veil{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#fff8e6,rgba(255,240,210,.85) 40%,rgba(255,230,200,0) 80%)}
#veil.go{animation:veil 2.4s ease-in-out}
@keyframes veil{0%{opacity:0}45%{opacity:1}100%{opacity:0}}

/* ---------- КОМПЛИМЕНТЫ ---------- */
.comp{position:absolute;max-width:min(90vw,720px);text-align:center;opacity:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.comp .n{font:italic 500 clamp(14px,3.6vw,18px) var(--serif);letter-spacing:.3em;text-transform:uppercase;color:var(--rose)}
.comp .w{font-family:var(--script);font-size:clamp(40px,11vw,92px);line-height:1.1;color:var(--gold);text-wrap:balance;
  text-shadow:0 0 24px rgba(232,194,122,.45),0 2px 0 rgba(0,0,0,.3)}
.comp .line{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.comp.in{animation:compIn 3.2s ease forwards}
.comp.in .line{animation:lineGrow 1.6s ease .6s forwards}
.comp.last.in{animation:compIn 4.6s ease forwards}
@keyframes compIn{0%{opacity:0;transform:translateY(24px) scale(.96);filter:blur(12px)}
  25%{opacity:1;transform:none;filter:blur(0)}80%{opacity:1;transform:none;filter:blur(0)}
  100%{opacity:0;transform:translateY(-24px);filter:blur(8px)}}
@keyframes lineGrow{to{width:min(60vw,320px)}}

/* ---------- ОТКРЫТКА ---------- */
#final{gap:clamp(14px,2.6vh,24px)}
.card{position:relative;width:min(84vw,380px);max-width:100%;padding:clamp(26px,5vh,40px) clamp(20px,6vw,36px);text-align:center;
  background:linear-gradient(170deg,#fffaf2 0%,#f6e6d4 100%);color:var(--velvet2);border-radius:200px 200px 18px 18px;
  box-shadow:0 0 0 2px var(--gold),0 0 0 8px rgba(251,241,228,.08),0 0 0 9px rgba(232,194,122,.5),0 40px 80px rgba(0,0,0,.6),0 0 90px rgba(232,194,122,.25);
  opacity:0;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.card.in{animation:cardIn 2.4s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes cardIn{0%{opacity:0;transform:perspective(900px) rotateX(70deg) translateY(60px) scale(.8)}100%{opacity:1;transform:none}}
.mono{width:clamp(66px,18vw,84px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#a12a5c,var(--velvet2));color:var(--gold);font-family:var(--script);
  font-size:clamp(38px,10vw,50px);box-shadow:0 0 0 3px var(--gold),0 0 0 6px #fffaf2,0 0 0 7px rgba(168,123,53,.6)}
.card .hb{font:600 clamp(13px,3.4vw,15px) var(--serif);letter-spacing:.32em;text-transform:uppercase;color:var(--gold2);margin-top:6px}
.card .name{font-family:var(--script);font-size:clamp(40px,11.5vw,58px);line-height:1;
  background:linear-gradient(100deg,#7a1f45 0%,#b23a6a 30%,#d79a3f 50%,#b23a6a 70%,#7a1f45 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-130% 0}}
.flour{display:flex;align-items:center;gap:10px;color:var(--gold2);width:80%}
.flour::before,.flour::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
.flour::after{transform:scaleX(-1)}
.wish{font:500 clamp(17px,4.4vw,20px)/1.45 var(--serif);color:#4a2238;max-width:30ch;text-wrap:pretty}
.wish i{font-style:italic;color:var(--velvet)}
.title{font-family:var(--script);font-size:clamp(34px,9.5vw,62px);color:var(--gold);text-align:center;line-height:1.05;opacity:0;
  text-shadow:0 0 20px rgba(232,194,122,.6),0 0 50px rgba(232,194,122,.3)}
.title.in{animation:titleIn 2s ease forwards}
@keyframes titleIn{from{opacity:0;letter-spacing:.2em;filter:blur(8px)}to{opacity:1;letter-spacing:0;filter:blur(0)}}
.again{font:italic 500 16px var(--serif);letter-spacing:.1em;color:var(--cream);background:transparent;border:1px solid rgba(232,194,122,.5);
  border-radius:30px;padding:9px 20px;cursor:pointer;opacity:0;transition:opacity 1s}
.again.show{opacity:.8}.again:hover{opacity:1}
.again:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#mute{position:fixed;z-index:9;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,194,122,.5);background:rgba(26,13,23,.6);color:var(--gold);
  font-size:20px;cursor:pointer;display:grid;place-items:center}
#mute:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#mute.off{opacity:.55;text-decoration:line-through}
[hidden]{display:none!important}
@media (max-height:620px){.card .mono{display:none}}
@media (prefers-reduced-motion:reduce){.gift,.hint,.card .name{animation:none!important}}
</style>
</head>
<body>


<div id="stage">
  <canvas id="fx"></canvas>

  <div class="scene" id="giftScene">
    <div class="glowFloor"></div>
    <div id="giftWrap" role="button" tabindex="0" aria-label="Открыть подарок">
      <div class="toptext">Для Марьям аппы</div>
      <div class="gift" id="gift">
        <div class="beam"></div>
        <div class="box"><div class="rib-v"></div><div class="rib-h"></div></div>
        <div class="lid"><div class="rib-v"></div></div>
        <div class="bow"><i></i><i></i><b></b></div>
        <div class="tag">Откройте подарок</div>
      </div>
      <div class="hint">нажмите на подарок</div>
    </div>
  </div>

  <div class="scene" id="compScene" hidden></div>

  <div class="scene" id="final" hidden>
    <div class="title" id="title">С днём рождения!</div>
    <div class="card" id="card">
      <div class="mono">М</div>
      <div class="hb">Дорогая наша</div>
      <div class="name">Марьям аппа</div>
      <div class="flour">✦</div>
      <div class="wish">Пусть каждый день дарит здоровье, радость и тепло, а дом всегда будет полон любимых людей. <i>Спасибо, что вы у нас есть!</i></div>
    </div>
    <button class="again" id="again" type="button">открыть ещё раз</button>
  </div>

  <div id="veil"></div>
  <button id="mute" type="button" aria-label="Выключить музыку" hidden>♪</button>
</div>

<script>
(()=>{
const compliments=[
  "Самая добрая",
  "Мудрая и понимающая",
  "Заботливая",
  "Настоящая красавица",
  "Золотые руки",
  "Душа нашей семьи",
  "Пример для всех нас",
  "И просто самая любимая тётя"
];
const $=id=>document.getElementById(id);
const stage=$("stage"),wrap=$("giftWrap"),gift=$("gift"),veil=$("veil"),giftScene=$("giftScene"),
  compScene=$("compScene"),fin=$("final"),card=$("card"),title=$("title"),again=$("again");
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- лепестки и искры ---- */
const cv=$("fx"),ctx=cv.getContext("2d");let W,H,parts=[],petalRate=.04,dust=[];
function size(){const d=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  dust=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6,v:Math.random()*.15+.05}))}
addEventListener("resize",size);size();
const PETALS=["#f2a7b8","#e98aa3","#fbd3dc","#d65f84","#fff0f3"];
function petal(y){parts.push({k:"p",x:Math.random()*W,y:y??-20,vx:(Math.random()-.5)*.6,vy:Math.random()*.7+.6,
  s:Math.random()*7+6,rot:Math.random()*6,vr:(Math.random()-.5)*.03,sw:Math.random()*6,c:PETALS[Math.random()*PETALS.length|0]})}
function sparkle(x,y,n,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(Math.random()*.7+.3)*spd;
  parts.push({k:"s",x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:Math.random()*.008+.005})}}
let t=0;
function draw(){t+=.016;ctx.clearRect(0,0,W,H);
  for(const s of dust){s.y-=s.v;if(s.y<-5)s.y=H+5;ctx.globalAlpha=.25+.25*Math.sin(t*1.5+s.p);ctx.fillStyle="#e8c27a";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  if(Math.random()<petalRate)petal();
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.k==="p"){p.x+=p.vx+Math.sin(t+p.sw)*.5;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,.6+.4*Math.abs(Math.sin(t*1.2+p.sw)));
      ctx.fillStyle=p.c;ctx.globalAlpha=.9;ctx.beginPath();ctx.moveTo(0,-p.s);
      ctx.bezierCurveTo(p.s,-p.s*.6,p.s*.8,p.s*.6,0,p.s);ctx.bezierCurveTo(-p.s*.8,p.s*.6,-p.s,-p.s*.6,0,-p.s);ctx.fill();ctx.restore();
      if(p.y>H+30)parts.splice(i,1);continue}
    p.vx*=.97;p.vy=p.vy*.97+.03;p.x+=p.vx;p.y+=p.vy;p.life-=p.d;if(p.life<=0){parts.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle="#ffe7b0";ctx.shadowBlur=10;ctx.shadowColor="#e8c27a";
    ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,7);ctx.fill();ctx.shadowBlur=0}
  ctx.globalAlpha=1;requestAnimationFrame(draw)}
draw();

/* ---- музыка: шкатулка на Web Audio ---- */
let ac=null,master=null,arpOn=false,arpTimer=null,nextT=0,step=0,muted=false;
const muteBtn=$("mute");
const hz=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(ac){ac.resume&&ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=ac.createGain();master.gain.value=.55;
  const comp=ac.createDynamicsCompressor();
  const dl=ac.createDelay(1);dl.delayTime.value=.34;
  const fb=ac.createGain();fb.gain.value=.38;
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;
  const wet=ac.createGain();wet.gain.value=.35;
  master.connect(comp);master.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(comp);
  comp.connect(ac.destination);
  muteBtn.hidden=false;
}
function bell(m,t,dur,vol){
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0004,t+dur);g.connect(master);
  [[1,1],[2,.3],[3.01,.1],[4.2,.04]].forEach(([mul,a])=>{const o=ac.createOscillator();o.type="sine";o.frequency.value=hz(m)*mul;
    const og=ac.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.05)});
}
function pad(ms,t,dur,vol){
  ms.forEach(m=>{const o=ac.createOscillator();o.type="triangle";o.frequency.value=hz(m);
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.8);g.gain.setValueAtTime(vol,t+Math.max(.8,dur-.8));g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1)});
}
/* нежный перебор: До – Ля минор – Фа – Соль */
const CH=[[48,55,64,67,72,76],[45,52,60,64,69,72],[41,48,57,60,65,69],[43,50,59,62,67,71]];
const PAT=[0,2,3,4,5,4,3,2],E8=.46;
function arpTick(){
  if(!arpOn||!ac)return;
  while(nextT<ac.currentTime+.4){
    const c=CH[Math.floor(step/8)%4],i=step%8;
    if(i===0){pad([c[0]-12,c[0]],nextT,E8*8,.035)}
    bell(c[PAT[i]]+12,nextT,1.8,i===0?.14:.09);
    nextT+=E8;step++;
  }
}
function startArp(at){if(!ac)return;arpOn=true;step=0;nextT=Math.max(ac.currentTime+.1,at||0);clearInterval(arpTimer);arpTimer=setInterval(arpTick,90);arpTick()}
function stopArp(){arpOn=false;clearInterval(arpTimer)}
/* «С днём рождения тебя» (народная мелодия) */
function birthday(){
  if(!ac)return;stopArp();
  const B=.72,T=ac.currentTime+.5;
  const mel=[[67,0,.75],[67,.75,.25],[69,1,1],[67,2,1],[72,3,1],[71,4,2],
    [67,6,.75],[67,6.75,.25],[69,7,1],[67,8,1],[74,9,1],[72,10,2],
    [67,12,.75],[67,12.75,.25],[79,13,1],[76,14,1],[72,15,1],[71,16,1],[69,17,2],
    [77,19,.75],[77,19.75,.25],[76,20,1],[72,21,1],[74,22,1],[72,23,3]];
  mel.forEach(([m,b,d])=>bell(m+12,T+b*B,Math.max(1.4,d*B*1.6),.2));
  const chords=[[[48,55,64],1,3],[[43,50,59],4,3],[[43,50,59],7,3],[[48,55,64],10,3],[[48,55,64],13,3],[[41,48,57],16,3],[[48,55,64],19,3],[[43,50,59],22,1],[[48,55,64],23,4]];
  chords.forEach(([c,b,d])=>{pad(c,T+b*B,d*B+.4,.05);bell(c[0]+12,T+b*B,2,.08)});
  startArp(T+27*B);
}
muteBtn.addEventListener("click",()=>{
  if(!ac)return;muted=!muted;master.gain.setTargetAtTime(muted?0:.55,ac.currentTime,.15);
  muteBtn.classList.toggle("off",muted);muteBtn.setAttribute("aria-label",muted?"Включить музыку":"Выключить музыку");
});

let busy=false;
async function openGift(){
  if(busy)return;busy=true;
  initAudio();if(!arpOn)startArp();
  wrap.querySelector(".hint").style.visibility="hidden";
  gift.classList.add("wiggle");await wait(2300);
  gift.classList.remove("wiggle");gift.classList.add("open");
  await wait(1000);const r=gift.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height*.4,120,6);
  await wait(1200);veil.classList.remove("go");void veil.offsetWidth;veil.classList.add("go");
  await wait(1100);giftScene.hidden=true;compScene.hidden=false;petalRate=.08;
  for(let i=0;i<compliments.length;i++){
    const last=i===compliments.length-1,el=document.createElement("div");
    el.className="comp"+(last?" last":"");
    el.innerHTML=`<div class="n">${last?"и главное":"Марьям аппа"}</div><div class="w">${compliments[i]}</div><div class="line"></div>`;
    compScene.appendChild(el);void el.offsetWidth;el.classList.add("in");
    await wait(700);sparkle(W/2,H/2,last?90:40,last?6:4);
    await wait(last?3900:2500);el.remove();
  }
  compScene.hidden=true;fin.hidden=false;petalRate=.35;for(let k=0;k<40;k++)petal(Math.random()*H*.5-H*.5);
  title.classList.add("in");birthday();await wait(900);card.classList.add("in");
  await wait(2200);const c=card.getBoundingClientRect();sparkle(c.left+c.width/2,c.top+30,140,7);
  await wait(2500);petalRate=.15;again.classList.add("show");busy=false;
}
function reset(){
  if(busy)return;parts=[];petalRate=.04;fin.hidden=true;title.classList.remove("in");card.classList.remove("in");again.classList.remove("show");
  gift.classList.remove("open","wiggle");wrap.querySelector(".hint").style.visibility="";giftScene.hidden=false;
}
wrap.addEventListener("click",openGift);
wrap.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openGift()}});
again.addEventListener("click",reset);
})();
</script>
